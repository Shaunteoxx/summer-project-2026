services:
  # ── MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:7
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Express backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/brokenomore
      - PORT=5000
    depends_on:
      mongo:
        condition: service_healthy

  # ── Vite frontend ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - API_URL=http://backend:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules

volumes:
  mongo_data:
  frontend_modules:
