services:
  # ── MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:7
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Express backend ──────────────────────────────────────
  server:
    build:
      context: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/brokenomore
      - PORT=5000
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./server:/app
      - server_modules:/app/node_modules

  # ── Vite frontend ────────────────────────────────────────
  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    environment:
      - API_URL=http://server:5000
    depends_on:
      - server
    volumes:
      - ./client:/app
      - client_modules:/app/node_modules

volumes:
  mongo_data:
  server_modules:
  client_modules:
