services:
  # ── MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:7
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Express backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/brokenomore
      - PORT=5000
    # Run the working tree, not the copy baked into the image, and restart on
    # save — the same arrangement the frontend has. Without this the container
    # keeps serving whatever the code looked like when the image was last
    # built, which shows up as a 404 on a route you have just written.
    #
    # node_modules is a named volume so the container keeps its own Linux
    # install rather than the host's macOS one. Docker only seeds that volume
    # from the image when the volume does not yet exist, so after changing
    # package.json it has to be dropped by hand — and *not* with
    # `docker compose down -v`, which removes every volume in the project,
    # mongo_data included. Drop this one alone:
    #
    #   docker compose stop backend && docker compose rm -f backend
    #   docker volume rm summer-project-2026_backend_modules
    #   docker compose up -d --build backend
    command: npm run dev
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  # ── Vite frontend ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - API_URL=http://backend:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules

volumes:
  mongo_data:
  backend_modules:
  frontend_modules:
