<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Keypad harness</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <script>
      // Match the app's pre-paint theme application.
      const p = new URLSearchParams(location.search);
      if (p.get("theme") !== "light") document.documentElement.classList.add("dark");
      document.documentElement.style.colorScheme = p.get("theme") || "dark";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/harness.jsx"></script>
  </body>
</html>
