<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Keypad harness</title>
    <!-- Must match index.html exactly. The harness is the instrument the design
         is checked against, so a different typeface here means every layout it
         "confirms" is measured wrong — and Geist runs wider than Inter. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />
    <script>
      // Match the app's pre-paint theme application.
      const p = new URLSearchParams(location.search);
      if (p.get("theme") !== "light") document.documentElement.classList.add("dark");
      document.documentElement.style.colorScheme = p.get("theme") || "dark";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/harness.jsx"></script>
  </body>
</html>
