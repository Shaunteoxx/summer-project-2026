name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Tests and the build are the gate, and they run first so a dependency
      # advisory can never stop them from running. This used to sit behind
      # `npm audit`, which failed the whole job before a single test ran.
      - run: npm test
      - run: npm run build
      # `npm audit` gates on *any* advisory in a production dependency, so a
      # newly published one in a transitive package (two react-router advisories
      # did exactly this) turned CI red with no code change. Report every
      # advisory for visibility, but only fail on a *critical* one — the level
      # that warrants stopping a merge. Remediate the rest by bumping the
      # flagged dependency, not by deleting this step. See HANDOFF.md §4.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # mongodb-memory-server downloads a mongod binary on first use; cache it
      # so the auth tests don't re-fetch it on every run.
      - name: Cache mongodb binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - run: npm test
      - name: Verify backend modules
        run: >-
          node -e "Promise.all([
          import('./config/env.js'),
          import('./controllers/authController.js'),
          import('./controllers/friendController.js'),
          import('./controllers/streakController.js'),
          import('./controllers/summaryController.js'),
          import('./controllers/transactionController.js')
          ]).then(() => process.exit(0))"
      # See the frontend job's note: report every advisory, fail only on a
      # critical one, and run it after the tests so it can't block them.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
