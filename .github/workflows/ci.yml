name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      # mongodb-memory-server downloads a mongod binary on first use; cache it
      # so the auth tests don't re-fetch it on every run.
      - name: Cache mongodb binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - run: npm test
      - name: Verify backend modules
        run: >-
          node -e "Promise.all([
          import('./config/env.js'),
          import('./controllers/authController.js'),
          import('./controllers/friendController.js'),
          import('./controllers/streakController.js'),
          import('./controllers/summaryController.js'),
          import('./controllers/transactionController.js')
          ]).then(() => process.exit(0))"